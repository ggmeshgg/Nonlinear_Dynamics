<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phase Plane Lab</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
:root {
  --bg: #f4f3ef; --panel: #ffffff; --ink: #1c1c1e; --muted: #6a6a70; --line: #e1dfd8;
  --canvas: #fbfaf7; --grid: #eeece6; --axis: #c4c1b8; --field: #9a9ca3;
  --nx: #c2410c; --ny: #0e7490; --traj: #1c1c1e; --auto: #8e8e96;
  --stable: #2563eb; --unstable: #dc2626; --energy: #7c3aed;
  --fp-stable: #0f766e; --fp-unstable: #b91c1c; --fp-saddle: #b45309; --fp-center: #7c3aed; --fp-degen: #6b7280;
  --accent: #0e7490; --bad: #b91c1c; --good: #0f766e; --chip: #efede7;
  --tint-pos: 220, 38, 38; --tint-neg: 37, 99, 235;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101113; --panel: #17181b; --ink: #e9e7e2; --muted: #9b9ba3; --line: #2a2b30;
    --canvas: #131417; --grid: #1c1d21; --axis: #3d3e45; --field: #62666f;
    --nx: #f59e5b; --ny: #4fb8d4; --traj: #ece9e2; --auto: #75757e;
    --stable: #6ea8ff; --unstable: #ff7b7b; --energy: #b79cff;
    --fp-stable: #2dd4bf; --fp-unstable: #f87171; --fp-saddle: #fbbf24; --fp-center: #c4b5fd; --fp-degen: #9ca3af;
    --accent: #4fb8d4; --bad: #f87171; --good: #2dd4bf; --chip: #212226;
    --tint-pos: 248, 113, 113; --tint-neg: 110, 168, 255;
  }
}
:root[data-theme="dark"] {
  --bg: #101113; --panel: #17181b; --ink: #e9e7e2; --muted: #9b9ba3; --line: #2a2b30;
  --canvas: #131417; --grid: #1c1d21; --axis: #3d3e45; --field: #62666f;
  --nx: #f59e5b; --ny: #4fb8d4; --traj: #ece9e2; --auto: #75757e;
  --stable: #6ea8ff; --unstable: #ff7b7b; --energy: #b79cff;
  --fp-stable: #2dd4bf; --fp-unstable: #f87171; --fp-saddle: #fbbf24; --fp-center: #c4b5fd; --fp-degen: #9ca3af;
  --accent: #4fb8d4; --bad: #f87171; --good: #2dd4bf; --chip: #212226;
  --tint-pos: 248, 113, 113; --tint-neg: 110, 168, 255;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  display: grid; grid-template-columns: 370px 1fr; overflow: hidden;
}
aside { overflow-y: auto; overflow-x: hidden; min-width: 0; padding: 14px 16px 24px; border-right: 1px solid var(--line); background: var(--panel); }
main { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
#plotwrap { position: relative; flex: 1; min-height: 0; }
#bifpanel { height: 40%; min-height: 220px; border-top: 1px solid var(--line); display: flex; flex-direction: column; background: var(--canvas); }
#bifpanel[hidden] { display: none; }
.bifbar { display: flex; align-items: center; gap: 12px; padding: 5px 10px; font-size: 13px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
.bifbar label { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); }
.bifbar select { padding: 1px 4px; }
.bifbar .sp { flex: 1; }
#bifstatus { color: var(--muted); font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
.biflegend { color: var(--muted); font-size: 12px; display: inline-flex; gap: 10px; align-items: center; }
.biflegend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 3px; }
#bif { flex: 1; width: 100%; min-height: 0; display: block; touch-action: none; cursor: ew-resize; }
button.mini { font-size: 12px; padding: 1px 7px; text-transform: none; letter-spacing: 0; }
button.mini kbd { font: 11px ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--muted); }
button.mini.on { border-color: var(--accent); color: var(--accent); }
#plot { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; display: block; }
h1 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: .01em; }
.top { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.top h1 { flex: 1; white-space: nowrap; }
.back { color: var(--muted); text-decoration: none; font-size: 18px; }
.back:hover { color: var(--ink); }
.top select { min-width: 0; width: 130px; }
select, button, input[type=text], input[type=number] {
  font: inherit; color: var(--ink); background: var(--chip); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px;
}
button { cursor: pointer; }
button:hover, select:hover { border-color: var(--muted); }
section { border-top: 1px solid var(--line); padding: 10px 0; }
section > .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px; display: flex; gap: 8px; align-items: center; }
section > .lbl .sp { flex: 1; }
.eq { display: grid; grid-template-columns: 54px minmax(0, 1fr); align-items: center; gap: 4px 6px; }
.eq .lhs { text-align: right; font-size: 17px; font-family: "Times New Roman", serif; white-space: nowrap; }
math-field {
  display: block; font-size: 18px; width: 100%; min-width: 0; min-height: 36px; padding: 2px 6px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--canvas); color: var(--ink);
  --caret-color: var(--accent); --selection-background-color: color-mix(in srgb, var(--accent) 25%, transparent);
  --contains-highlight-background-color: transparent;
}
math-field:focus-within { outline: 2px solid color-mix(in srgb, var(--accent) 50%, transparent); outline-offset: 0; }
math-field.err { border-color: var(--bad); }
math-field::part(menu-toggle) { display: none; }
math-field.locked { border-style: dashed; color: var(--muted); }
.lhs math-field { display: inline-block; width: auto; min-height: 0; padding: 0; border: 0; background: transparent; font-size: 17px; }
.lhs math-field::part(virtual-keyboard-toggle) { display: none; }
.msg { grid-column: 2; font-size: 12px; color: var(--bad); min-height: 0; }
.msg:empty { display: none; }
.vars { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); margin-bottom: 8px; flex-wrap: wrap; }
.vars input[type=text] { width: 64px; padding: 2px 6px; }
.vars select { padding: 2px 4px; }
.param { margin-bottom: 8px; }
.param .row1 { display: flex; align-items: baseline; gap: 6px; }
.param .name { font-family: "Times New Roman", serif; font-style: italic; font-size: 16px; }
.param .val { width: 78px; padding: 1px 4px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
.param .row2 { display: grid; grid-template-columns: 52px 1fr 52px; gap: 6px; align-items: center; }
.param .row2 input[type=number] { padding: 1px 4px; font-size: 11px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--muted); width: 100%; }
.param input[type=range] { width: 100%; accent-color: var(--accent); }
.empty { color: var(--muted); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--chip); cursor: pointer; user-select: none; }
.chip kbd { font: 11px ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--muted); }
.chip.off { opacity: .45; }
.chip .sw { width: 14px; height: 3px; border-radius: 2px; }
.badges { display: flex; flex-direction: column; gap: 4px; }
.badge { font-size: 13px; padding: 4px 8px; border-radius: 6px; background: var(--chip); border-left: 3px solid var(--muted); }
.badge.good { border-left-color: var(--good); }
.badge.bad { border-left-color: var(--bad); }
.badge small { color: var(--muted); display: block; font-size: 12px; }
table.fps { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.fps td { padding: 3px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.fps td.num { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; white-space: nowrap; }
table.fps tr { cursor: pointer; }
table.fps tr:hover td { background: var(--chip); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 2px solid; vertical-align: -1px; }
#td { width: 100%; height: 210px; display: block; border-radius: 6px; background: var(--canvas); border: 1px solid var(--line); }
.help { font-size: 12px; color: var(--muted); }
#crn { display: flex; flex-direction: column; gap: 2px; }
#crn math-field.rx { border: 0; background: transparent; min-height: 0; padding: 0 2px; font-size: 16px; }
#crn math-field.rx::part(virtual-keyboard-toggle) { display: none; }
.help kbd { font: 11px ui-monospace, "SF Mono", Menlo, Consolas, monospace; background: var(--chip); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
#legend { position: absolute; left: 12px; top: 10px; font-size: 12px; background: color-mix(in srgb, var(--panel) 85%, transparent); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; display: flex; gap: 12px; pointer-events: none; }
#legend span { display: inline-flex; align-items: center; gap: 5px; }
#legend i { width: 16px; height: 3px; border-radius: 2px; display: inline-block; }
#coords { position: absolute; right: 12px; bottom: 10px; font: 12px ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--muted); pointer-events: none; }
#tip { position: absolute; pointer-events: none; display: none; font-size: 12.5px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; box-shadow: 0 4px 14px rgba(0,0,0,.12); max-width: 260px; }
#tip b { font-weight: 600; }
#tip .num { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
#toast { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 5px 12px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
@media (max-width: 760px) {
  body { grid-template-columns: 1fr; grid-template-rows: 62vh auto; overflow-y: auto; overflow-x: hidden; height: auto; }
  main { grid-row: 1; height: 62vh; }
  body.bif-on main { height: 92vh; }
  aside { grid-row: 2; border-right: 0; border-top: 1px solid var(--line); overflow: visible; overflow-x: clip; }
  #legend { font-size: 11px; gap: 8px; }
}
</style>
</head>
<body>
<aside>
  <div class="top">
    <a class="back" href="../" title="Back to the club">←</a>
    <h1>Phase Plane Lab</h1>
    <select id="preset" title="Load an example"><option value="">Examples…</option></select>
    <button id="share" title="Copy a link to this exact view">Share</button>
  </div>

  <section>
    <div class="vars">
      <select id="mode" title="Form of the equations"><option value="xy">ẋ, ẏ</option><option value="so">ẍ (2nd order)</option><option value="polar">ṙ, θ̇ (polar)</option></select>
      <span id="varbox">variables <input id="v0" type="text" value="x" spellcheck="false"> <input id="v1" type="text" value="y" spellcheck="false"></span>
      <span id="polarnote" hidden>use r and θ; plotted in the x, y plane</span>
    </div>
    <div class="eq">
      <div class="lhs" id="lf"></div><div class="mfslot" id="mf"></div><div class="msg" id="ef"></div>
      <div class="lhs" id="lg"></div><div class="mfslot" id="mg"></div><div class="msg" id="eg"></div>
      <div class="lhs"><i>E</i> =</div><div class="mfslot" id="mE" data-placeholder="\text{optional: conserved qty or Lyapunov fn}"></div><div class="msg" id="eE"></div>
    </div>
  </section>

  <section>
    <div class="lbl">Parameters <span class="sp"></span><button id="bifbtn" class="mini" title="Sweep a parameter: fixed-point branches, limit cycles, bifurcation points">bifurcation diagram <kbd>B</kbd></button></div>
    <div id="params"></div>
  </section>

  <section>
    <div class="lbl">Structure</div>
    <div class="badges" id="badges"></div>
  </section>

  <section>
    <div class="lbl">Reaction network <span class="sp"></span><span title="Mass-action kinetics: the variables are concentrations (≥ 0); a reaction aX+bY→cX+dY with rate k adds k(c−a)x^a y^b to ẋ">mass action ⓘ</span></div>
    <div id="crn"></div>
  </section>

  <section>
    <div class="lbl">Layers</div>
    <div class="chips" id="layers"></div>
  </section>

  <section>
    <div class="lbl">Fixed points <span class="sp"></span><span id="fpcount"></span></div>
    <table class="fps" id="fps"></table>
  </section>

  <section>
    <div class="lbl">Trace–determinant plane</div>
    <canvas id="td"></canvas>
  </section>

  <section class="help">
    <kbd>click</kbd>/<kbd>drag</kbd> trajectory &nbsp; <kbd>shift</kbd>/<kbd>right</kbd>-drag pan &nbsp; <kbd>wheel</kbd> zoom<br>
    <kbd>F</kbd> fit &nbsp; <kbd>C</kbd> clear &nbsp; <kbd>Z</kbd> undo &nbsp; <kbd>Tab</kbd> next field
  </section>
</aside>
<main>
  <div id="plotwrap">
    <canvas id="plot"></canvas>
    <div id="legend"></div>
    <div id="coords"></div>
    <div id="tip"></div>
    <div id="toast"></div>
  </div>
  <div id="bifpanel" hidden>
    <div class="bifbar">
      <b>Bifurcation diagram</b>
      <label>sweep <select id="bifp"></select></label>
      <label>plot <select id="bifc"><option value="x">x</option><option value="y">y</option><option value="r">r = √(x²+y²)</option></select></label>
      <label><input type="checkbox" id="bifcyc" checked> limit cycles</label>
      <span id="bifstatus"></span>
      <span class="sp"></span>
      <span class="biflegend" id="biflegend"></span>
      <button id="bifclose" class="mini" title="Close (B)">×</button>
    </div>
    <canvas id="bif"></canvas>
  </div>
</main>

<!-- core.js imports the Compute Engine by package name, so the same file loads in Node for the tests -->
<script type="importmap">
{ "imports": { "@cortex-js/compute-engine": "https://cdn.jsdelivr.net/npm/@cortex-js/compute-engine@0.153.0/dist/esm-min/compute-engine.js" } }
</script>
<script type="module">
import { MathfieldElement } from 'https://cdn.jsdelivr.net/npm/mathlive@0.111.1/mathlive.min.mjs';
import {
  P, use, symTex, symHtml, compileLatex, factorTex, buildModel, fmt,
  fx, gy, trajectory, sampleGrid, contour, interpGrid, hamiltonianGrid,
  detectStructure, equilibria, fpTable, buildCRN, project, bifSweep,
} from './core.js';

MathfieldElement.fontsDirectory = 'https://cdn.jsdelivr.net/npm/mathlive@0.111.1/fonts/';
MathfieldElement.soundsDirectory = null;
const $ = id => document.getElementById(id);

// ---------- state ----------

const LAYERS = [
  { k: 'v', name: 'field' },
  { k: 'n', name: 'nullclines' },
  { k: 'm', name: 'manifolds' },
  { k: 'e', name: 'energy' },
  { k: 'o', name: 'sample orbits' },
];
const state = {
  f: '', g: '', E: '', vars: ['x', 'y'], so: false, polar: false,
  params: {},          // name → {v, min, max}
  seeds: [],           // user trajectories [x, y]
  layers: { v: true, n: true, m: true, e: true, o: true },
};
let view = { cx: 0, cy: 0, s: 0.01 };   // s = world units per CSS px
let model = null;                        // { f, g, E, used: [names], ... }; core.js holds it too, via use()

const PRESETS = [
  { name: 'Linear system', f: 'ax+by', g: 'cx+dy', params: { a: [-0.5, -3, 3], b: [2, -3, 3], c: [-2, -3, 3], d: [-0.5, -3, 3] }, r: 3 },
  { name: 'Competition (rabbits vs sheep)', f: 'x(3-x-2y)', g: 'y(2-x-y)', view: [1.5, 1.2], r: 1.9 },
  { name: 'Predator–prey with conserved E', f: 'x(a-y)', g: 'y(x-b)', E: 'x-b\\ln x+y-a\\ln y', params: { a: [1, 0.1, 3], b: [1, 0.1, 3] }, view: [1.3, 1.3], r: 1.6 },
  { name: 'Pendulum (damping b)', vars: ['theta', 'v'], so: true, g: '-\\sin\\theta-bv', params: { b: [0, 0, 1] }, r: 3.6 },
  { name: 'Double-well oscillator', so: true, g: 'x-x^3-by', params: { b: [0, 0, 1] }, r: 1.9 },
  { name: 'Van der Pol oscillator', so: true, g: '\\mu(1-x^2)y-x', params: { mu: [1, 0, 5] }, r: 4 },
  { name: 'Hopf bifurcation (supercritical)', f: '\\mu x-y-x(x^2+y^2)', g: 'x+\\mu y-y(x^2+y^2)', params: { mu: [0.2, -1, 1] }, r: 1.4, bif: 'mu' },
  { name: 'Saddle-node bifurcation', f: '\\mu-x^2', g: '-y', params: { mu: [0.5, -1, 1] }, r: 1.8, bif: 'mu' },
  { name: 'Pitchfork bifurcation', f: '\\mu x-x^3', g: '-y', params: { mu: [0.5, -1, 1] }, r: 1.6, bif: 'mu' },
  { name: 'Transcritical bifurcation', f: '\\mu x-x^2', g: '-y', params: { mu: [0.5, -1, 1] }, r: 1.6, bif: 'mu' },
  { name: 'Glycolytic oscillator', f: '-x+ay+x^2y', g: 'b-ay-x^2y', params: { a: [0.08, 0, 0.2], b: [0.6, 0, 1.5] }, view: [1, 1.3], r: 1.6 },
  { name: 'Lyapunov function check', f: '-x+4y', g: '-x-y^3', E: 'x^2+4y^2', r: 1.6 },
  { name: 'Reversible system', f: 'y-y^3', g: '-x-y^2', view: [-0.4, 0], r: 1.8 },
  { name: 'Hopf, supercritical (polar)', polar: true, f: '\\mu r-r^3', g: '\\omega+br^2', params: { mu: [0.2, -0.5, 0.5], omega: [1, -2, 2], b: [0, -2, 2] }, r: 1.2, bif: 'mu' },
  { name: 'Hopf, subcritical (polar)', polar: true, f: '\\mu r+r^3-r^5', g: '\\omega+br^2', params: { mu: [-0.1, -0.5, 0.3], omega: [1, -2, 2], b: [0, -2, 2] }, r: 1.6, bif: 'mu' },
  { name: 'Infinite-period bifurcation (polar)', polar: true, f: 'r(1-r^2)', g: '\\mu-\\sin\\theta', params: { mu: [1.2, 0, 2] }, r: 1.6, bif: 'mu' },
  { name: 'Linear center, nonlinear spiral', f: '-y+ax(x^2+y^2)', g: 'x+ay(x^2+y^2)', params: { a: [0, -1, 1] }, r: 1.4 },
];

// ---------- UI wiring: equations ----------

// fields are created here so the fonts path above is set before MathLive renders anything
for (const id of ['mf', 'mg', 'mE']) {
  const slot = $(id), m = new MathfieldElement();
  m.id = id;
  if (slot.dataset.placeholder) m.placeholder = slot.dataset.placeholder;
  slot.replaceWith(m);
}
const mf = $('mf'), mg = $('mg'), mE = $('mE');
const lab = {};
for (const id of ['lf', 'lg']) {
  const m = new MathfieldElement();
  m.readOnly = true; m.tabIndex = -1;
  $(id).appendChild(m); lab[id] = m;
}
for (const el of [mf, mg, mE]) {
  el.smartFence = true;
  el.addEventListener('input', () => { readFields(); rebuild(); });
}

function readFields() {
  if (!state.so) state.f = mf.value;
  state.g = mg.value;
  state.E = mE.value;
}

function writeFields() {
  mf.value = state.so ? symTex(state.vars[1]) : state.f;
  mf.readOnly = state.so;
  mf.classList.toggle('locked', state.so);
  mg.value = state.g;
  mE.value = state.E;
  $('v0').value = state.vars[0];
  $('v1').value = state.vars[1];
  $('mode').value = state.polar ? 'polar' : state.so ? 'so' : 'xy';
  $('varbox').hidden = state.polar;
  $('polarnote').hidden = !state.polar;
  updateLabels();
}

function updateLabels() {
  const [a, b] = state.polar ? ['r', '\\theta'] : state.vars.map(symTex);
  lab.lf.value = `\\dot{${a}}=`;
  lab.lg.value = state.so ? `\\ddot{${a}}=` : `\\dot{${b}}=`;
}

for (const id of ['v0', 'v1']) $(id).addEventListener('input', () => {
  state.vars = [$('v0').value.trim() || 'x', $('v1').value.trim() || 'y'];
  if (state.so) mf.value = symTex(state.vars[1]);
  updateLabels(); rebuild();
});
$('mode').addEventListener('change', () => {
  const m = $('mode').value;
  state.so = m === 'so'; state.polar = m === 'polar';
  if (!state.so && !state.f) state.f = state.polar ? 'r' : symTex(state.vars[1]);
  writeFields(); rebuild();
  $('mode').blur();
});

let modelId = 0;

function rebuild() {
  const vars = state.polar ? ['r', 'theta'] : state.vars;
  const out = {};
  for (const [key, latex, el, msg] of [
    ['f', state.so ? symTex(vars[1]) : state.f, mf, 'ef'],
    ['g', state.g, mg, 'eg'],
    ['E', state.E, mE, 'eE'],
  ]) {
    try {
      out[key] = compileLatex(latex, vars);
      el.classList.remove('err'); $(msg).textContent = '';
    } catch (err) {
      out[key] = undefined;
      el.classList.add('err'); $(msg).textContent = err.message;
    }
  }
  // an empty field clears the plot; a half-typed one keeps the last good model
  if (out.f && out.g) { model = buildModel(out.f, out.g, out.E, vars, state.polar); modelId++; }
  else if (out.f === null || out.g === null) model = null;
  use(model);
  if (model) for (const n of model.used) if (!state.params[n]) state.params[n] = { v: 1, min: -2, max: 2 };
  renderParams();
  requestDraw(true);
}

// ---------- parameters ----------

let paramKey = '';
const paramSync = {};

  const names = model ? model.used.slice().sort() : [];

    const sync = () => {

}

// ---------- layers ----------

function renderLayers() {
  $('layers').innerHTML = LAYERS.map(l => `<span class="chip ${state.layers[l.k] ? '' : 'off'}" data-k="${l.k}">${l.name} <kbd>${l.k.toUpperCase()}</kbd></span>`).join('');

$('layers').addEventListener('click', e => {

// ---------- canvas & view ----------

const cv = $('plot'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  const r = cv.getBoundingClientRect(), r0 = W > 1 && H > 1 ? radius() : 0;
  DPR = window.devicePixelRatio || 1;
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  if (r0) view.s = r0 / (Math.min(W, H) / 2);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  const t = $('td'); const tr = t.getBoundingClientRect();
  t.width = Math.round(tr.width * DPR); t.height = Math.round(tr.height * DPR);
  requestDraw(true);
}
new ResizeObserver(resize).observe(cv);

const toS = (x, y) => [(x - view.cx) / view.s + W / 2, H / 2 - (y - view.cy) / view.s];
const toW = (px, py) => [view.cx + (px - W / 2) * view.s, view.cy - (py - H / 2) * view.s];
const bounds = () => ({ x0: view.cx - W / 2 * view.s, x1: view.cx + W / 2 * view.s, y0: view.cy - H / 2 * view.s, y1: view.cy + H / 2 * view.s });
const setRadius = (cx, cy, r) => { view = { cx, cy, s: r / (Math.min(W, H) / 2) }; };
const radius = () => view.s * Math.min(W, H) / 2;
// fn sampled every `step` CSS px over the view
const viewGrid = (fn, step) => sampleGrid(fn, bounds(), Math.ceil(W / step) + 1, Math.ceil(H / step) + 1);

// ---------- analysis ----------

let an = null;

const conservative = () => !!(an && (an.hamiltonian || (an.E && an.E.conserved)));

// on-screen trajectories: steps of a few pixels, symplectic when Hamiltonian
const integrate = (x, y, dir, maxSteps) =>
  trajectory(x, y, dir, maxSteps, bounds(), view.s, { closed: conservative(), symplectic: !!(an && an.hamiltonian) });

function analyze() {
  if (!model) { an = null; return; }
  an = { ...detectStructure(bounds()) };
  an.crn = buildCRN();
  Object.assign(an, equilibria(bounds(), Math.ceil(W / 4) + 1, Math.ceil(H / 4) + 1, an));
  const span = 2 * radius();
  // energy
  an.energy = null;
  const Efn = model.E && an.E && an.E.conserved ? (x, y) => model.E(x, y, P) : null;
  if (state.layers.e && (an.hamiltonian || model.E)) {
    const usingE = !!model.E && (!!Efn || !an.hamiltonian);
    const G = usingE ? viewGrid((x, y) => model.E(x, y, P), 4) : hamiltonianGrid(viewGrid(null, 4));
    const vals = Array.from(G.v).filter(isFinite).sort((a, b) => a - b);
    const levels = [], sep = [];
    if (vals.length > 10) for (let k = 0; k < 15; k++) levels.push(vals[Math.floor((k + 0.5) / 15 * vals.length)]);
    for (const p of an.fps) if (p.stab === 'saddle') {
      const e = usingE ? model.E(p.x, p.y, P) : interpGrid(G, p.x, p.y);
      if (isFinite(e)) sep.push(e);
    }
    const efn = usingE ? (x, y) => model.E(x, y, P) : null;
    an.energy = {
      segs: levels.map(l => contour(G, l, efn)),
      sep: sep.map(l => contour(G, l, efn)),
      faint: usingE && !an.E.conserved,
    };
  }
  // dE/dt tint when E is not conserved (Lyapunov view)
  an.tint = null;
  if (state.layers.e && model.E && an.E && !an.E.conserved) an.tint = edotImage();
  // saddle manifolds
  an.man = [];
  if (state.layers.m) for (const p of an.fps) if (p.stab === 'saddle' && p.vecs) {
    const d = 1e-3 * span;
    const [vs, vu] = p.vecs;  // eig sorted: [negative, positive]
    for (const sg of [1, -1]) {
      an.man.push({ kind: 'u', pts: integrate(p.x + sg * d * vu[0], p.y + sg * d * vu[1], 1, 4000) });
      an.man.push({ kind: 's', pts: integrate(p.x + sg * d * vs[0], p.y + sg * d * vs[1], -1, 4000) });
    }
  }
  // sample orbits (hidden when energy contours already show the orbits)
  an.auto = [];
  if (state.layers.o && !(an.energy && !an.energy.faint)) {
    const b = bounds();
    for (let i = 0; i < 5; i++) for (let j = 0; j < 4; j++) {
      const x = b.x0 + (b.x1 - b.x0) * (i + 0.5) / 5, y = b.y0 + (b.y1 - b.y0) * (j + 0.5) / 4;
      an.auto.push({ f: integrate(x, y, 1, 1500), b: integrate(x, y, -1, 1500) });
    }
  }
  an.user = state.seeds.map(([x, y]) => ({ f: integrate(x, y, 1, 6000), b: integrate(x, y, -1, 6000) }));
}

function edotImage() {
  const step = 6, E = model.E, G = viewGrid(null, step), { nx, ny, xs, ys } = G;
  const vals = new Float64Array(nx * ny);
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const x = xs[i], y = ys[j], h = 1e-6 * (1 + Math.abs(x) + Math.abs(y));
    const Ex = (E(x + h, y, P) - E(x - h, y, P)) / (2 * h), Ey = (E(x, y + h, P) - E(x, y - h, P)) / (2 * h);
    vals[j * nx + i] = Ex * fx(x, y) + Ey * gy(x, y);
  }
  const mags = Array.from(vals).filter(isFinite).map(Math.abs).sort((a, b) => a - b);
  const ref = mags[Math.floor(0.9 * mags.length)] || 1;
  const off = new OffscreenCanvas(nx, ny), o = off.getContext('2d'), img = o.createImageData(nx, ny);
  const cs = getComputedStyle(document.documentElement);
  const pos = cs.getPropertyValue('--tint-pos').split(',').map(Number), neg = cs.getPropertyValue('--tint-neg').split(',').map(Number);
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const v = vals[j * nx + i], k = ((ny - 1 - j) * nx + i) * 4;
    if (!isFinite(v)) continue;
    const c = v > 0 ? pos : neg, a = Math.min(1, Math.abs(v) / ref);
    img.data[k] = c[0]; img.data[k + 1] = c[1]; img.data[k + 2] = c[2]; img.data[k + 3] = 70 * Math.sqrt(a);
  }
  o.putImageData(img, 0, 0);

}

const speciesTex = i => { const n = state.vars[i]; return /^[a-z]$/.test(n) ? n.toUpperCase() : symTex(n); };
const complexTex = c => c.map((n, i) => n ? (n > 1 ? n : '') + speciesTex(i) : '').filter(Boolean).join('+') || '\\varnothing';
function rateTex(r) {
  const up = [], down = [];
  for (const [k, p] of Object.entries(r.f)) {
    const t = factorTex(k), a = Math.abs(p);
    (p > 0 ? up : down).push(a === 1 ? t : `${t}^{${+a.toPrecision(4)}}`);
  }
  const n = Math.abs(r.num), num = String(+n.toPrecision(4));
  const top = (n === 1 && up.length ? '' : num) + up.join('');
  return (r.num < 0 ? '-' : '') + (down.length ? `\\frac{${top || 1}}{${down.join('')}}` : top);
}
const reactionTex = r => `${complexTex(r.r)}\\xrightarrow{${rateTex(r)}}${complexTex(r.p)}`;

// ---------- drawing ----------

let dirtyModel = true, frame = 0, preview = null, hover = null;
function requestDraw(model) { if (model) dirtyModel = true; if (!frame) frame = requestAnimationFrame(draw); }

function colors() {
  const cs = getComputedStyle(document.documentElement), c = {};
  for (const k of ['canvas', 'grid', 'axis', 'field', 'nx', 'ny', 'traj', 'auto', 'stable', 'unstable', 'energy', 'fp-stable', 'fp-unstable', 'fp-saddle', 'fp-center', 'fp-degen', 'muted', 'ink', 'line', 'accent'])
    c[k] = cs.getPropertyValue('--' + k).trim();
  return c;
}
const fpColor = (p, C) => ({ stable: C['fp-stable'], unstable: C['fp-unstable'], saddle: C['fp-saddle'], center: C['fp-center'], degen: C['fp-degen'] })[p.stab];

function draw() {
  frame = 0;
  if (!W) return;
  if (dirtyModel) {
    dirtyModel = false;
    try { analyze(); } catch (e) { console.error(e); an = null; }
    renderSidebar();
    saveURL();
    if (bif.on && model) bifMaybeStart();
  }
  const C = colors();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = C.canvas; ctx.fillRect(0, 0, W, H);
  drawGrid(C);
  if (!model || !an) { drawTD(C); return; }
  if (an.tint) { ctx.imageSmoothingEnabled = true; ctx.drawImage(an.tint, 0, 0, W, H); }
  if (an.energy) {
    ctx.lineWidth = 1; ctx.strokeStyle = C.energy;
    ctx.globalAlpha = an.energy.faint ? 0.3 : 0.55;
    an.energy.segs.forEach(s => strokeSegs(s));
    ctx.globalAlpha = an.energy.faint ? 0.5 : 0.95; ctx.lineWidth = 2;
    an.energy.sep.forEach(s => strokeSegs(s));
    ctx.globalAlpha = 1;
  }
  if (state.layers.v) drawField(C);
  if (state.layers.n && an.ncf) {
    ctx.lineWidth = 2;
    ctx.strokeStyle = C.nx; strokeSegs(an.ncf);
    ctx.strokeStyle = C.ny; strokeSegs(an.ncg);
  }
  ctx.lineWidth = 1;
  for (const o of an.auto) { drawPath(o.f, 1, C.auto, 1, 0.7, 2); drawPath(o.b, -1, C.auto, 1, 0.7, 2); }
  for (const m of an.man) drawPath(m.pts, m.kind === 'u' ? 1 : -1, m.kind === 'u' ? C.unstable : C.stable, 1.8, 0.95);
  for (const o of an.user) { drawPath(o.f, 1, C.traj, 1.8, 1); drawPath(o.b, -1, C.traj, 1.8, 0.55); }
  if (preview) { drawPath(preview.f, 1, C.traj, 2, 1); drawPath(preview.b, -1, C.traj, 2, 0.55); }
  for (const p of an.fps) drawFP(ctx, ...toS(p.x, p.y), p, C, 6);
  drawTD(C);
  drawBif();
}

function drawGrid(C) {
  const b = bounds(), span = Math.max(b.x1 - b.x0, b.y1 - b.y0);
  const raw = span / 10, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 5, 10].map(m => m * mag).find(s => s >= raw);
  ctx.lineWidth = 1; ctx.strokeStyle = C.grid; ctx.beginPath();
  for (let x = Math.ceil(b.x0 / step) * step; x <= b.x1; x += step) { const [px] = toS(x, 0); ctx.moveTo(Math.round(px) + .5, 0); ctx.lineTo(Math.round(px) + .5, H); }
  for (let y = Math.ceil(b.y0 / step) * step; y <= b.y1; y += step) { const [, py] = toS(0, y); ctx.moveTo(0, Math.round(py) + .5); ctx.lineTo(W, Math.round(py) + .5); }
  ctx.stroke();
  const [ox, oy] = toS(0, 0);
  ctx.strokeStyle = C.axis; ctx.beginPath();
  ctx.moveTo(0, Math.round(oy) + .5); ctx.lineTo(W, Math.round(oy) + .5);
  ctx.moveTo(Math.round(ox) + .5, 0); ctx.lineTo(Math.round(ox) + .5, H);
  ctx.stroke();
  ctx.fillStyle = C.muted; ctx.font = '11px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
  const lx = Math.min(Math.max(ox + 4, 4), W - 40), ly = Math.min(Math.max(oy - 4, 14), H - 4);
  const fmtT = v => +v.toPrecision(3);
  ctx.textAlign = 'center';
  for (let x = Math.ceil(b.x0 / step) * step; x <= b.x1; x += step) if (Math.abs(x) > step / 2) ctx.fillText(fmtT(x), toS(x, 0)[0], ly);
  ctx.textAlign = 'left';
  for (let y = Math.ceil(b.y0 / step) * step; y <= b.y1; y += step) if (Math.abs(y) > step / 2) ctx.fillText(fmtT(y), lx, toS(0, y)[1] + 4);
  ctx.font = 'italic 15px "Times New Roman", serif'; ctx.fillStyle = C.ink;
  const plain = n => symHtml(n).replace(/<sub>(.*)<\/sub>/, '_$1');
  ctx.fillText(plain(state.vars[0]), W - 18, ly - 12);
  ctx.fillText(plain(state.vars[1]), lx + 4, 18);
}

function strokeSegs(s) {
  ctx.beginPath();
  for (let k = 0; k < s.length; k += 4) {
    const [a, b] = toS(s[k], s[k + 1]), [c, d] = toS(s[k + 2], s[k + 3]);
    ctx.moveTo(a, b); ctx.lineTo(c, d);
  }
  ctx.stroke();
}

function drawField(C) {
  const sp = 30, L = 11;
  const items = [];
  let maxLog = -Infinity, minLog = Infinity;
  for (let py = sp / 2; py < H; py += sp) for (let px = sp / 2; px < W; px += sp) {
    const [x, y] = toW(px, py), f = fx(x, y), g = gy(x, y), m = Math.hypot(f, g);
    if (!isFinite(m) || m === 0) continue;
    const lg = Math.log(m);

    const x0 = px - ux * L / 2, y0 = py - uy * L / 2, x1 = px + ux * L / 2, y1 = py + uy * L / 2;
    ctx.beginPath();
    ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
    ctx.lineTo(x1 - ux * 4 - uy * 3, y1 - uy * 4 + ux * 3);
    ctx.moveTo(x1, y1); ctx.lineTo(x1 - ux * 4 + uy * 3, y1 - uy * 4 - ux * 3);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

// path in world coords; dir = −1 means points run backward in time (arrows flipped)
function drawPath(pts, dir, color, width, alpha, maxArrows = 12) {
  if (!pts || pts.length < 4) return;
  ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = width;
  ctx.beginPath();
  let [px, py] = toS(pts[0], pts[1]);
  ctx.moveTo(px, py);
  let acc = 0;
  const arrows = [];
  for (let k = 2; k < pts.length; k += 2) {
    const [qx, qy] = toS(pts[k], pts[k + 1]);
    const d = Math.hypot(qx - px, qy - py);
    if (d > 2000) { ctx.moveTo(qx, qy); px = qx; py = qy; continue; }
    ctx.lineTo(qx, qy);
    acc += d;
    if (acc > 110 && d > 0.01 && arrows.length < maxArrows) { acc = 0; arrows.push([qx, qy, (qx - px) / d * dir, (qy - py) / d * dir]); }
    px = qx; py = qy;
  }
  ctx.stroke();
  for (const [x, y, ux, uy] of arrows) {
    if (x < -10 || y < -10 || x > W + 10 || y > H + 10) continue;
    const s = 3 + width * 1.5;
    ctx.beginPath();
    ctx.moveTo(x + ux * s, y + uy * s);
    ctx.lineTo(x - ux * s - uy * s * 0.7, y - uy * s + ux * s * 0.7);
    ctx.lineTo(x - ux * s + uy * s * 0.7, y - uy * s - ux * s * 0.7);
    ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawFP(c, x, y, p, C, r) {
  const col = fpColor(p, C);
  c.lineWidth = 2; c.strokeStyle = col; c.fillStyle = col;
  c.beginPath();
  if (p.stab === 'saddle') {
    c.moveTo(x, y - r - 1); c.lineTo(x + r + 1, y); c.lineTo(x, y + r + 1); c.lineTo(x - r - 1, y); c.closePath();
    c.fillStyle = C.canvas; c.fill(); c.stroke();
    c.beginPath(); c.moveTo(x, y - r - 1); c.lineTo(x, y + r + 1); c.lineTo(x + r + 1, y); c.closePath(); c.fillStyle = col; c.fill();
    return;
  }
  c.arc(x, y, r, 0, 2 * Math.PI);
  if (p.stab === 'stable') c.fill();
  else { c.fillStyle = C.canvas; c.fill(); c.stroke(); }
  if (p.stab === 'center') { c.beginPath(); c.arc(x, y, 2, 0, 2 * Math.PI); c.fillStyle = col; c.fill(); }
}

// ---------- trace–determinant inset ----------

function drawTD(C) {
  const t = $('td'), c = t.getContext('2d'), w = t.width / DPR, h = t.height / DPR;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.clearRect(0, 0, w, h);
  const fps = an ? an.fps.filter(p => p.inView) : [];
  let R = 1;
  for (const p of fps) if (isFinite(p.tau) && isFinite(p.det)) R = Math.max(R, Math.abs(p.tau) * 1.25, 2 * Math.sqrt(Math.abs(p.det)) * 1.1);
  const D = R * R / 4 * 1.15;
  const X = tau => w / 2 + tau / R * (w / 2 - 12), Y = det => h * 0.62 - det / D * (h * 0.62 - 12);
  c.strokeStyle = C.axis; c.lineWidth = 1; c.beginPath();
  c.moveTo(0, Y(0)); c.lineTo(w, Y(0)); c.moveTo(X(0), 0); c.lineTo(X(0), h); c.stroke();
  c.strokeStyle = C.muted; c.setLineDash([4, 3]); c.beginPath();
  for (let k = 0; k <= 60; k++) { const tau = -R + 2 * R * k / 60; const px = X(tau), py = Y(tau * tau / 4); k ? c.lineTo(px, py) : c.moveTo(px, py); }
  c.stroke(); c.setLineDash([]);
  c.fillStyle = C.muted; c.font = '10.5px system-ui, sans-serif'; c.textAlign = 'center';
  c.fillText('saddles', w / 2, h - 8);
  c.fillText('stable spirals', X(-R * 0.33), 14);
  c.fillText('unstable spirals', X(R * 0.33), 14);
  c.fillText('stable nodes', X(-R * 0.8), Y(D * 0.1) + 3);
  c.fillText('unstable nodes', X(R * 0.8), Y(D * 0.1) + 3);
  c.textAlign = 'left'; c.fillText('τ', w - 12, Y(0) - 4); c.fillText('Δ', X(0) + 4, 26);
  for (const p of fps) if (isFinite(p.tau) && isFinite(p.det)) drawFP(c, X(p.tau), Math.max(4, Math.min(h - 4, Y(p.det))), p, C, 4.5);
}

// ---------- sidebar output ----------

const fmtEigs = e => !e ? 'n/a' : Array.isArray(e[0]) ? `${Math.abs(e[0][0]) < 1e-9 ? '' : fmt(e[0][0]) + ' '}± ${fmt(Math.abs(e[0][1]))}i` : e.map(fmt).join(', ');

let lastSide = '', lastCRN = '';
function renderCRN() {
  const crn = an && an.crn, box = $('crn');
  const key = !crn ? '' : crn.err ? crn.err : crn.rx.map(reactionTex).join('\n');
  if (key === lastCRN) return;
  lastCRN = key;
  box.innerHTML = '';
  if (!crn) return;
  if (crn.err) { box.innerHTML = `<div class="empty">${crn.err}</div>`; return; }
  for (const t of key.split('\n')) {
    const m = new MathfieldElement();
    m.readOnly = true; m.tabIndex = -1; m.className = 'rx';
    m.value = t;
    box.appendChild(m);
  }
}
function renderSidebar() {
  let badges = '', fps = '';
  if (an) {
    const B = (cls, t, s) => `<div class="badge ${cls}">${t}${s ? `<small>${s}</small>` : ''}</div>`;
    if (an.hamiltonian) badges += B('good', 'Conservative: Hamiltonian', `${an.divNote}, so energy H is conserved; H contours drawn, symplectic integrator used`);
    if (an.revY) badges += B('good', `Reversible under t→−t, ${symHtml(state.vars[1])}→−${symHtml(state.vars[1])}`, 'linear centers on the symmetry axis are true centers');
    if (an.revX) badges += B('good', `Reversible under t→−t, ${symHtml(state.vars[0])}→−${symHtml(state.vars[0])}`, 'linear centers on the symmetry axis are true centers');
    if (an.E) {
      const e = an.E;
      if (e.conserved) badges += B('good', 'E is conserved ✓', 'dE/dt = 0 at all sampled points; level sets are orbits');
      else if (e.pos === 0 && e.neg > 0) badges += B('good', 'dE/dt ≤ 0 in view: Lyapunov candidate', 'E decreases along every trajectory here (blue tint)');
      else if (e.neg === 0 && e.pos > 0) badges += B('', 'dE/dt ≥ 0 in view', 'E increases along trajectories (red tint)');
      else badges += B('bad', 'E is not conserved', 'tint shows where dE/dt > 0 (red) or < 0 (blue)');
    }
    if (!badges) badges = `<div class="empty">No conserved quantity or symmetry detected in view${an.divNote ? ` (${an.divNote})` : ''}.</div>`;
    const C = colors();
    const { rows, curve } = fpTable(an.fps);
    fps = rows.map(([p, i]) => `<tr data-i="${i}"><td><span class="dot" style="border-color:${fpColor(p, C)};background:${p.stab === 'stable' || p.stab === 'saddle' ? fpColor(p, C) : 'transparent'}"></span></td>
      <td>${p.type}${p.note ? `<br><span class="help">${p.note}</span>` : ''}</td>
      <td class="num">(${fmt(p.x)}, ${fmt(p.y)})<br>λ = ${fmtEigs(p.eig)}</td></tr>`).join('');
    if (curve) fps += `<tr><td><span class="dot" style="border-color:${C['fp-degen']}"></span></td><td colspan="2">curve of fixed points (Δ = 0 everywhere on it)<br><span class="help">${curve} points sampled in view; the linearization is inconclusive along it</span></td></tr>`;
  }
  renderCRN();
  const side = badges + '|' + fps;
  if (side === lastSide) return;
  lastSide = side;
  $('badges').innerHTML = badges;
  $('fps').innerHTML = fps || '<tr><td class="empty">none in view</td></tr>';
  $('fpcount').textContent = an ? `${fpTable(an.fps).count} in view` : '';
  const C = colors(), [a, b] = state.vars.map(symHtml);
  $('legend').innerHTML = `<span><i style="background:${C.nx}"></i>${a}&#775;=0</span><span><i style="background:${C.ny}"></i>${b}&#775;=0</span>` +
    (state.layers.m ? `<span><i style="background:${C.stable}"></i>stable mfd</span><span><i style="background:${C.unstable}"></i>unstable mfd</span>` : '');
}
$('fps').addEventListener('click', e => {
  const tr = e.target.closest('tr[data-i]'); if (!tr || !an) return;
  const p = an.fps[+tr.dataset.i];
  view.cx = p.x; view.cy = p.y; requestDraw(true);
});

// ---------- bifurcation diagram ----------
// The sweep itself is bifSweep in core.js, over the slider range and the current view; here it runs in
// slices of ~14 ms so the page stays responsive, and the result is drawn.

const bif = { on: false, param: null, coord: 'x', cycles: true, data: null, job: 0, key: '', timer: 0, map: null };
const bifCv = $('bif'), bctx = bifCv.getContext('2d');
let BW = 0, BH = 0;
new ResizeObserver(() => {
  const r = bifCv.getBoundingClientRect();
  BW = r.width; BH = r.height;
  bifCv.width = Math.round(BW * DPR); bifCv.height = Math.round(BH * DPR);
  drawBif();
}).observe(bifCv);

const coordOf = (x, y) => project(bif.coord, x, y);
const plainSym = n => symHtml(n).replace(/<sub>(.*)<\/sub>/, '_$1');

function setBif(on) {
  bif.on = !!(on && model && model.used.length);
  document.body.classList.toggle('bif-on', bif.on);
  $('bifpanel').hidden = !bif.on;
  $('bifbtn').classList.toggle('on', bif.on);
  if (bif.on) { syncBifControls(); bif.key = ''; }
  requestDraw(true);
}
function syncBifControls() {
  const names = model ? model.used.slice().sort() : [];
  $('bifbtn').disabled = !names.length;
  if (!names.length) { if (bif.on) setBif(false); return; }
  if (!names.includes(bif.param)) bif.param = names.includes('mu') ? 'mu' : names[0];
  $('bifp').innerHTML = names.map(n => `<option value="${n}"${n === bif.param ? ' selected' : ''}>${plainSym(n)}</option>`).join('');
  const [a, b] = state.vars.map(plainSym);
  $('bifc').options[0].text = a; $('bifc').options[1].text = b;
  $('bifc').options[2].text = `r = √(${a}²+${b}²)`;
  $('bifc').value = bif.coord;
  $('bifcyc').checked = bif.cycles;
}
$('bifbtn').addEventListener('click', () => setBif(!bif.on));
$('bifclose').addEventListener('click', () => setBif(false));
$('bifp').addEventListener('change', () => { bif.param = $('bifp').value; requestDraw(true); });
$('bifc').addEventListener('change', () => { bif.coord = $('bifc').value; bif.key = ''; requestDraw(true); });
$('bifcyc').addEventListener('change', () => { bif.cycles = $('bifcyc').checked; requestDraw(true); });

function bifMaybeStart() {
  const p = state.params[bif.param];
  if (!p) return;
  const b = bounds();
  const others = model.used.filter(n => n !== bif.param).map(n => `${n}=${P[n]}`).join(',');
  const key = [modelId, bif.param, p.min, p.max, bif.coord, bif.cycles, others, b.x0, b.x1, b.y0, b.y1].join('|');
  if (key === bif.key) return;
  bif.key = key;
  clearTimeout(bif.timer);
  bif.timer = setTimeout(bifStart, 200);
}

function bifStart() {
  if (!bif.on || !model || !state.params[bif.param]) return;
  const job = ++bif.job, name = bif.param, { min, max } = state.params[name];
  if (!(max > min)) return;
  const N = 241, sw = bifSweep(name, min, max, bounds(), { N, coord: bif.coord, cycles: bif.cycles, conservative: conservative() });
  bif.data = sw.d;
  let i = 0;
  const step = () => {
    if (job !== bif.job) return;
    const t0 = performance.now();
    while (i < N && performance.now() - t0 < 14) sw.sample(i++);
    $('bifstatus').textContent = i < N ? `computing ${Math.round(100 * i / N)}%` : '';
    if (i >= N) sw.finish();
    drawBif();
    if (i < N) setTimeout(step, 0);
  };
  step();
}

const MARK_INFO = { H: 'Hopf: τ crosses 0 with Δ > 0', BP: 'branch point: Δ crosses 0 (transcritical / pitchfork)', F: 'fold: a branch ends (saddle-node)' };

function niceTicks(lo, hi, n) {
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 5, 10].map(m => m * mag).find(s => s >= raw);
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-12; v += step) out.push(Math.abs(v) < step * 1e-9 ? 0 : v);
  return out;
}

function drawBif() {
  if (!bif.on || !BW || !BH) return;
  const C = colors(), c = bctx, d = bif.data;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.fillStyle = C.canvas; c.fillRect(0, 0, BW, BH);
  $('biflegend').innerHTML = `<span><i style="border-color:${C['fp-stable']}"></i>stable</span><span><i style="border-color:${C['fp-unstable']};border-top-style:dashed"></i>unstable</span><span><i style="border-color:${C['fp-saddle']};border-top-style:dotted"></i>saddle</span>` +
    (bif.cycles ? (d && d.conservative ? `<span title="div f = 0 or E is conserved: closed orbits come in families and are not limit cycles">no limit cycles: conservative system</span>` : `<span style="color:${C.energy}">● cycle max/min</span>`) : '');
  if (!d || d.name !== bif.param) return;
  const L = 52, Rm = 14, T = 12, B = 28;
  let lo = Infinity, hi = -Infinity;
  for (const arr of d.fps) if (arr) for (const q of arr) { const v = coordOf(q.x, q.y); lo = Math.min(lo, v); hi = Math.max(hi, v); }
  for (const arr of d.cyc) if (arr) for (const cy of arr) { lo = Math.min(lo, cy.lo); hi = Math.max(hi, cy.hi); }
  if (!isFinite(lo)) { lo = -1; hi = 1; }
  if (hi - lo < 1e-9) { lo -= 1; hi += 1; }
  const pad = 0.08 * (hi - lo); lo -= pad; hi += pad;
  const X = mu => L + (mu - d.min) / (d.max - d.min) * (BW - L - Rm);
  const Y = v => T + (hi - v) / (hi - lo) * (BH - T - B);
  bif.map = { X, Y, L, Rm, d };
  // axes and ticks
  c.font = '11px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
  c.strokeStyle = C.grid; c.lineWidth = 1; c.fillStyle = C.muted;
  c.textAlign = 'center';
  for (const v of niceTicks(d.min, d.max, 8)) { const px = Math.round(X(v)) + .5; c.beginPath(); c.moveTo(px, T); c.lineTo(px, BH - B); c.stroke(); c.fillText(+v.toPrecision(3), px, BH - B + 14); }
  c.textAlign = 'right';
  for (const v of niceTicks(lo, hi, 5)) { const py = Math.round(Y(v)) + .5; c.beginPath(); c.moveTo(L, py); c.lineTo(BW - Rm, py); c.stroke(); c.fillText(+v.toPrecision(3), L - 6, py + 4); }
  c.strokeStyle = C.axis;
  if (lo < 0 && hi > 0) { c.beginPath(); c.moveTo(L, Math.round(Y(0)) + .5); c.lineTo(BW - Rm, Math.round(Y(0)) + .5); c.stroke(); }
  c.strokeRect(L + .5, T + .5, BW - L - Rm, BH - T - B);
  c.font = 'italic 14px "Times New Roman", serif'; c.fillStyle = C.ink;
  c.textAlign = 'right'; c.fillText(plainSym(d.name), BW - Rm, BH - 4);
  c.textAlign = 'left'; c.fillText(bif.coord === 'r' ? 'r' : plainSym(state.vars[bif.coord === 'x' ? 0 : 1]), 6, T + 12);
  // fixed-point branches
  c.save();
  c.beginPath(); c.rect(L, T, BW - L - Rm, BH - T - B); c.clip();
  const styles = {
    stable: [C['fp-stable'], 2.4, []], unstable: [C['fp-unstable'], 1.6, [6, 4]],
    saddle: [C['fp-saddle'], 1.6, [2, 3]], center: [C['fp-center'], 1.6, [6, 4]], degen: [C['fp-degen'], 1.4, [2, 3]],
  };
  if (d.segs) {
    for (const [stab, [col, w, dash]] of Object.entries(styles)) {
      // chain segments into one polyline per branch so dash patterns run continuously
      const chains = [], tail = new Map();
      for (const s of d.segs) if (s.q.stab === stab) {
        let ch = tail.get(s.p);
        if (!ch) { ch = [[X(d.mus[s.i - 1]), Y(coordOf(s.p.x, s.p.y))]]; chains.push(ch); }
        tail.delete(s.p);
        ch.push([X(d.mus[s.i]), Y(coordOf(s.q.x, s.q.y))]);
        tail.set(s.q, ch);
      }
      c.strokeStyle = col; c.lineWidth = w; c.setLineDash(dash); c.beginPath();
      for (const ch of chains) ch.forEach(([px, py], k) => k ? c.lineTo(px, py) : c.moveTo(px, py));
      c.stroke();
    }
    c.setLineDash([]);
  } else {
    d.fps.forEach((arr, i) => arr && arr.forEach(q => { c.fillStyle = styles[q.stab][0]; c.fillRect(X(d.mus[i]) - 1, Y(coordOf(q.x, q.y)) - 1, 2, 2); }));
  }
  // limit cycles
  c.lineWidth = 1.2;
  d.cyc.forEach((arr, i) => arr && arr.forEach(cy => {
    for (const v of cy.lo === cy.hi ? [cy.lo] : [cy.lo, cy.hi]) {
      c.beginPath(); c.arc(X(d.mus[i]), Y(v), 2, 0, 2 * Math.PI);
      if (cy.stable) { c.fillStyle = C.energy; c.fill(); } else { c.strokeStyle = C.energy; c.stroke(); }
    }
  }));
  c.restore();
  // bifurcation markers (deduplicated on screen, H and BP before F)
  const placed = [];
  bif.marks = [];
  for (const m of [...(d.marks || [])].sort((a, b) => (a.kind === 'F') - (b.kind === 'F'))) {
    const px = X(m.mu), py = Y(m.c);
    if (placed.some(([qx, qy]) => Math.hypot(qx - px, qy - py) < 14)) continue;
    placed.push([px, py]); bif.marks.push({ ...m, px, py });
    c.fillStyle = C.canvas; c.strokeStyle = C.ink; c.lineWidth = 1.4;
    c.beginPath(); c.moveTo(px, py - 5); c.lineTo(px + 5, py); c.lineTo(px, py + 5); c.lineTo(px - 5, py); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = C.ink; c.font = '600 11px system-ui, sans-serif'; c.textAlign = 'left';
    c.fillText(m.kind, px + 7, py - 6);
  }
  // current parameter value and its fixed points
  const v = state.params[d.name] ? state.params[d.name].v : NaN;
  if (v >= d.min && v <= d.max) {
    const px = X(v);
    c.strokeStyle = C.accent || C.ink; c.globalAlpha = 0.6; c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(px, T); c.lineTo(px, BH - B); c.stroke(); c.globalAlpha = 1;
    if (an && an.fps) for (const q of an.fps) { const py = Y(coordOf(q.x, q.y)); if (py > T && py < BH - B) drawFP(c, px, py, q, C, 4.5); }
  }
}

function bifPointer(e) {
  const m = bif.map;
  if (!m || !bif.data) return;
  const d = m.d, mu = d.min + (e.offsetX - m.L) / (BW - m.L - m.Rm) * (d.max - d.min);
  const near = (bif.marks || []).find(k => Math.hypot(k.px - e.offsetX, k.py - e.offsetY) < 9);
  $('bifstatus').textContent = near ? `${near.kind} at ${plainSym(d.name)} ≈ ${fmt(near.mu)}: ${MARK_INFO[near.kind]}` : `${plainSym(d.name)} = ${fmt(mu)}`;
  if (!(e.buttons & 1)) return;
  const p = state.params[d.name];
  p.v = +Math.min(d.max, Math.max(d.min, mu)).toPrecision(5);
  P[d.name] = p.v;
  if (paramSync[d.name]) paramSync[d.name]();
  requestDraw(true);
}
bifCv.addEventListener('pointerdown', e => { bifCv.setPointerCapture(e.pointerId); bifPointer(e); });
bifCv.addEventListener('pointermove', bifPointer);
bifCv.addEventListener('pointerleave', () => { if (bif.data && bif.data.done) $('bifstatus').textContent = ''; });

// ---------- interaction ----------

const pointers = new Map();
let drag = null;

cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, [e.offsetX, e.offsetY]);
  if (pointers.size === 2) { preview = null; drag = { mode: 'pinch', start: pinchState(), view: { ...view } }; return; }
  if (e.button === 2 || e.button === 1 || e.shiftKey) drag = { mode: 'pan', x: e.offsetX, y: e.offsetY, view: { ...view } };
  else { drag = { mode: 'traj' }; setPreview(e.offsetX, e.offsetY); }
  hideTip();
});
cv.addEventListener('pointermove', e => {
  const [wx, wy] = toW(e.offsetX, e.offsetY);
  $('coords').textContent = `${state.vars[0]} = ${fmt(wx)}   ${state.vars[1]} = ${fmt(wy)}`;
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, [e.offsetX, e.offsetY]);
  if (!drag) { showTip(e.offsetX, e.offsetY); return; }
  if (drag.mode === 'pan') {
    view.cx = drag.view.cx - (e.offsetX - drag.x) * view.s;
    view.cy = drag.view.cy + (e.offsetY - drag.y) * view.s;
    requestDraw(true);
  } else if (drag.mode === 'pinch' && pointers.size === 2) {
    const now = pinchState(), st = drag.start, v0 = drag.view;
    const s = v0.s * st.d / Math.max(now.d, 1);
    const [ax, ay] = [v0.cx + (st.x - W / 2) * v0.s, v0.cy - (st.y - H / 2) * v0.s];
    view = { s, cx: ax - (now.x - W / 2) * s, cy: ay + (now.y - H / 2) * s };
    requestDraw(true);
  } else if (drag.mode === 'traj') setPreview(e.offsetX, e.offsetY);
});
const endPointer = e => {
  pointers.delete(e.pointerId);
  if (drag && drag.mode === 'traj' && preview) { state.seeds.push(preview.seed); preview = null; requestDraw(true); }
  if (pointers.size === 0) drag = null;
  else if (drag && drag.mode === 'pinch') drag = null;
};
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', e => { preview = null; endPointer(e); requestDraw(); });
cv.addEventListener('pointerleave', () => { hideTip(); $('coords').textContent = ''; });
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const k = Math.exp(e.deltaY * (e.deltaMode ? 0.05 : 0.0015));
  const [ax, ay] = toW(e.offsetX, e.offsetY);
  view.s *= k;
  view.cx = ax - (e.offsetX - W / 2) * view.s;
  view.cy = ay + (e.offsetY - H / 2) * view.s;
  requestDraw(true);
}, { passive: false });

function pinchState() {
  const [a, b] = [...pointers.values()];
  return { x: (a[0] + b[0]) / 2, y: (a[1] + b[1]) / 2, d: Math.hypot(a[0] - b[0], a[1] - b[1]) };
}
function setPreview(px, py) {
  if (!model || !an) return;
  const [x, y] = toW(px, py);
  preview = { seed: [x, y], f: integrate(x, y, 1, 6000), b: integrate(x, y, -1, 6000) };
  requestDraw();
}

function showTip(px, py) {
  const tip = $('tip');
  if (!an) return hideTip();
  const p = an.fps.find(q => { const [sx, sy] = toS(q.x, q.y); return Math.hypot(sx - px, sy - py) < 10; });
  if (!p) return hideTip();
  tip.innerHTML = `<b>${p.type}</b>${p.note ? `<br><span style="color:var(--muted)">${p.note}</span>` : ''}
    <div class="num">(${fmt(p.x)}, ${fmt(p.y)})${p.eig ? `<br>J = [${fmt(p.J[0])}, ${fmt(p.J[1])}; ${fmt(p.J[2])}, ${fmt(p.J[3])}]<br>τ = ${fmt(p.tau)}, Δ = ${fmt(p.det)}, τ²−4Δ = ${fmt(p.disc)}<br>λ = ${fmtEigs(p.eig)}` : ''}</div>`;
  tip.style.display = 'block';
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.min(px + 14, W - r.width - 8) + 'px';
  tip.style.top = Math.min(py + 14, H - r.height - 8) + 'px';
}
const hideTip = () => { $('tip').style.display = 'none'; };

function fit() {
  if (!model) return;
  const pts = an ? an.fps : [];
  if (!pts.length) { setRadius(0, 0, 3); requestDraw(true); return; }
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const p of pts) { x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y); }
  const r = Math.max(1, 0.75 * Math.max(x1 - x0, y1 - y0));
  view.cx = (x0 + x1) / 2; view.cy = (y0 + y1) / 2;
  view.s = Math.max(2 * r / W, 2 * r / H, (x1 - x0 + 2 * r) / W, (y1 - y0 + 2 * r) / H);
  requestDraw(true);
}

document.addEventListener('keydown', e => {
  if (e.target.closest?.('math-field, input, select, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'f') fit();
  else if (k === 'c') { state.seeds = []; requestDraw(true); }
  else if (k === 'z') { state.seeds.pop(); requestDraw(true); }
  else if (k === 'b') setBif(!bif.on);
  else if (LAYERS.some(l => l.k === k)) toggleLayer(k);
  else return;
  e.preventDefault();
});

// ---------- presets, URL state, share ----------

const sel = $('preset');
PRESETS.forEach((p, i) => sel.add(new Option(p.name, i)));
sel.addEventListener('change', () => {
  if (sel.value === '') return;
  loadPreset(PRESETS[+sel.value]);
  sel.value = '';
  sel.blur();
});

function loadPreset(p) {
  state.vars = p.vars ? [...p.vars] : ['x', 'y'];
  state.so = !!p.so; state.polar = !!p.polar;
  state.f = p.so ? '' : p.f;
  if (p.bif) bif.param = p.bif;
  bif.coord = p.polar ? 'r' : 'x';
  state.g = p.g; state.E = p.E || '';
  state.seeds = [];
  for (const [n, [v, min, max]] of Object.entries(p.params || {})) state.params[n] = { v, min, max };
  paramKey = '';
  writeFields();
  const [cx, cy] = p.view || [0, 0];
  setRadius(cx, cy, p.r || 3);
  rebuild();
}

let saveTimer = 0;
function saveURL() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const q = new URLSearchParams();
    if (!state.so) q.set('f', state.f);
    q.set('g', state.g);
    if (state.E) q.set('E', state.E);
    q.set('vars', state.vars.join(','));
    if (state.so) q.set('so', '1');
    if (state.polar) q.set('mode', 'polar');
    if (bif.on) q.set('bif', `${bif.param}:${bif.coord}`);
    if (model) q.set('p', model.used.map(n => { const p = state.params[n]; return `${n}:${p.v}:${p.min}:${p.max}`; }).join(';'));
    const r6 = v => +v.toPrecision(6);
    q.set('view', [view.cx, view.cy, radius()].map(r6).join(','));
    if (state.seeds.length) q.set('t', state.seeds.map(s => s.map(r6).join(',')).join(';'));
    q.set('L', LAYERS.filter(l => state.layers[l.k]).map(l => l.k).join(''));
    history.replaceState(null, '', '#' + q.toString());
  }, 250);
}

function loadURL() {
  const h = location.hash.slice(1);
  if (!h) return false;
  const q = new URLSearchParams(h);
  if (!q.has('g')) return false;
  state.vars = (q.get('vars') || 'x,y').split(',');
  state.so = q.get('so') === '1';
  state.polar = q.get('mode') === 'polar';
  if (q.has('bif')) { const [bp, bc] = q.get('bif').split(':'); bif.param = bp; bif.coord = bc || 'x'; bif.wanted = true; }
  state.f = q.get('f') || ''; state.g = q.get('g'); state.E = q.get('E') || '';
  for (const s of (q.get('p') || '').split(';').filter(Boolean)) {
    const [n, v, min, max] = s.split(':');
    state.params[n] = { v: +v, min: +min, max: +max };
  }
  state.seeds = (q.get('t') || '').split(';').filter(Boolean).map(s => s.split(',').map(Number));
  if (q.has('L')) { const L = q.get('L'); for (const l of LAYERS) state.layers[l.k] = L.includes(l.k); }
  const [cx, cy, r] = (q.get('view') || '0,0,3').split(',').map(Number);
  setRadius(cx, cy, r);
  return true;
}

$('share').addEventListener('click', async () => {
  saveURL();
  setTimeout(async () => {
    try { await navigator.clipboard.writeText(location.href); toast('Link copied'); }
    catch { toast('Copy the address bar to share'); }
  }, 300);
});
function toast(t) { const el = $('toast'); el.textContent = t; el.style.opacity = 1; setTimeout(() => el.style.opacity = 0, 1600); }

// ---------- boot ----------

resize();
renderLayers();
if (loadURL()) { writeFields(); rebuild(); if (bif.wanted) setBif(true); }
else loadPreset(PRESETS[1]);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { lastSide = ''; requestDraw(true); });
</script>
</body>
</html>
